; =============================================================================
; PANDA · Paso a Nivel Dinámico y Activo
; Firmware de nodo sobre LILYGO T-Beam Supreme (V3), 915 MHz, SX1262, MAX-M10S
;
; Cada rol del nodo es un entorno de compilación distinto. Se elige desde la
; barra de PlatformIO en VS Code (icono de carpeta abajo) o con:
;   pio run -e registrador -t upload
;
; Roles: "registrador" (fase 1), "tren" y "cruce" (fase 2). La lógica de
; decisión del cruce llega en la fase 3.
; =============================================================================

[platformio]
default_envs = registrador
boards_dir   = boards

[env]
; Plataforma y librerías con versión fija para que el build sea reproducible.
platform  = espressif32@6.13.0
framework = arduino

; Definición de placa basada en la oficial de LilyGo (8 MB flash QIO y
; 8 MB PSRAM QSPI). Ver boards/panda-tbeam-supreme.json.
board                  = panda-tbeam-supreme
board_build.partitions = default_8MB.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; El core Arduino 2.0.17 compila con gnu++11 por defecto. Pasamos a C++17
; para usar constexpr más ricos, std::atomic sin sorpresas y enum class.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
; Advertencias estrictas solo para nuestro código, no para las librerías.
build_src_flags =
    -Wall
    -Wextra

lib_deps =
    jgromes/RadioLib@7.7.1
    lewisxhe/XPowersLib@0.3.3
    olikraus/U8g2@2.36.18
    sparkfun/SparkFun u-blox GNSS v3@3.1.15
    lewisxhe/SensorLib@0.5.0

; -----------------------------------------------------------------------------
; Registrador: caja negra para los viajes en tren. Graba GNSS a 10 Hz e IMU a
; ~224 Hz en la microSD y sube la posición a Traccar por el hotspot del celular.
; No transmite por LoRa.
; -----------------------------------------------------------------------------
[env:registrador]
build_flags =
    ${env.build_flags}
    -DPANDA_ROLE_REGISTRADOR

; -----------------------------------------------------------------------------
; Nodo tren: todo lo del registrador más el beacon LoRa de 35 bytes cifrado y
; autenticado, uno por trama de 100 ms en su ranura TDMA.
; -----------------------------------------------------------------------------
[env:tren]
build_flags =
    ${env.build_flags}
    -DPANDA_ROLE_TREN

; -----------------------------------------------------------------------------
; Nodo cruce: recibe y valida los beacons, mide el enlace (RSSI, SNR, pérdida,
; antigüedad del dato, distancia) y sube a Traccar el tren recibido por radio.
; -----------------------------------------------------------------------------
[env:cruce]
build_flags =
    ${env.build_flags}
    -DPANDA_ROLE_CRUCE
